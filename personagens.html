<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens - Vila de Khalmorya</title>
    <!-- Fontes Medievais -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./firebase-config.js";

        onAuthStateChanged(auth, async (user) => {
            const listaDiv = document.getElementById('lista-personagens');
            if (user) {
                let userSnap = await getDoc(doc(db, "usuarios", user.uid));
                let papel = userSnap.exists() ? userSnap.data().papel : "jogador";

                const querySnapshot = await getDocs(collection(db, "fichas"));
                if (querySnapshot.empty) {
                    listaDiv.innerHTML = "<p>Ainda não existem heróis registados na nuvem.</p>";
                    return;
                }

                let html = "<div style='display:grid; gap:10px;'>";
                let encontrou = false;

                querySnapshot.forEach((d) => {
                    let ficha = d.data();
                    if (papel === "jogador" && ficha.uid !== user.uid) {
                        return;
                    }

                    encontrou = true;
                    // Guardamos os dados em formato seguro para passar por parâmetro no botão de backup individual
                    let fichaJsonStr = encodeURIComponent(JSON.stringify(ficha));

                    html += `
                        <div style="background:#fdfbf7; border:1px solid #b59b6c; padding:12px; border-radius:3px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                            <div>
                                <strong style="font-family:'Cinzel',serif; color:#8b0000; font-size:1.1em;">${ficha.nomeHeroi || 'Herói sem nome'}</strong><br>
                                <span style="font-size:0.85em; color:#5c4033;">Criador: ${ficha.email || 'Desconhecido'} | Arquétipo: ${ficha.arquetipo || 'N/D'}</span>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <button type="button" class="btn-acao" onclick="abrirFicha('${d.id}')">📂 Abrir</button>
                                <button type="button" class="btn-acao" style="background:#7c5a3b;" onclick="baixarBackupIndividual(ográficas('${d.id}', decodeURIComponent('${fichaJsonStr}'))">💾 Backup</button>
                                <button type="button" class="btn-acao" style="background:#8b0000;" onclick="deletarFichaLista('${d.id}')">🗑️ Excluir</button>
                            </div>
                        </div>
                    `;
                });

                html += "</div>";
                if (!encontrou) {
                    listaDiv.innerHTML = "<p>Ainda não tens nenhum herói guardado na nuvem.</p>";
                } else {
                    listaDiv.innerHTML = html;
                }
            } else {
                listaDiv.innerHTML = "<p>Tens de fazer login para aceder aos personagens.</p>";
            }
        });

        window.abrirFicha = function(fichaId) {
            window.location.href = `ficha.html?id=${fichaId}`;
        };

        window.baixarBackupIndividual = function(id, dadosStr) {
            let dados = JSON.parse(dadosStr);
            let blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `${(dados.nomeHeroi || 'heroi').replace(/[^a-z0-9]/gi, '_').toLowerCase()}_backup.json`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.deletarFichaLista = async function(fichaId) {
            if (confirm("Tens a certeza absoluta que queres excluir esta ficha da nuvem?")) {
                try {
                    await deleteDoc(doc(db, "fichas", fichaId));
                    alert("Ficha excluída com sucesso!");
                    location.reload();
                } catch (e) {
                    console.error("Erro ao excluir ficha:", e);
                    alert("Erro ao excluir a ficha.");
                }
            }
        };

        window.restaurarBackupJSON = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const user = auth.currentUser;
            if (!user) {
                alert("Precisas de estar logado para restaurar uma ficha.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    let dadosRestaurados = JSON.parse(e.target.result);
                    
                    // Garante que a ficha restaurada pertence ao utilizador atual e atualiza a data
                    dadosRestaurados.uid = user.uid;
                    dadosRestaurados.email = user.email;
                    dadosRestaurados.atualizadoEm = new Date();

                    let novoId = user.uid + "_" + Date.now();
                    await setDoc(doc(db, "fichas", novoId), dadosRestaurados);
                    
                    alert("Ficha restaurada com sucesso para a nuvem!");
                    location.reload();
                } catch (err) {
                    console.error("Erro ao ler JSON:", err);
                    alert("O ficheiro JSON selecionado é inválido.");
                }
            };
            reader.readAsText(file);
        };
    </script>

    <style>

            outline: 2px solid #8c6d46;
            outline-offset: -10px;
        }
        .header {
            display: flex;

        }
        .panel {

        .btn-acao {

            cursor: pointer;

    <a href="guia.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">📖 Guia</a>
    <a href="ficha.html" onclick="sessionStorage.setItem('veio_do_index', 'true')" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">🛡️ Ficha</a>
    <a href="grimorio.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">✨ Magias</a>
    <a href="historia.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">🗺️ História & Mapa</a>
    <a href="personagens.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">📜 Personagens</a>
    <a href="painel.html" id="link-painel-admin" style="display:none; background: #8b0000; color: #fff; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">⚙️ Painel Admin</a>
    <div id="user-menu-area" style="display:inline-block; margin-left: 10px;"></div>
</div>

<div class="container">
        <div class="header">
            <h1>Lista de Personagens</h1>
        </div>

        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2 style="font-family:'Cinzel',serif; color:#4a2e18; font-size:1.1em; margin:0;">Heróis da Aventura</h2>
                <div>
                    <input type="file" id="input-restaurar-json" accept=".json" style="display: none;" onchange="restaurarBackupJSON(event)">
                    <button type="button" class="btn-acao" onclick="document.getElementById('input-restaurar-json').click()" style="background:#205493;">📂 Restaurar Backup (JSON)</button>
                </div>
            </div>
            <div id="lista-personagens">A carregar os personagens...</div>
