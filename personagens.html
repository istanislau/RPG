<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens - Vila de Khalmorya</title>
    <!-- Fontes Medievais -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./firebase-config.js";

        onAuthStateChanged(auth, async (user) => {
            const listaDiv = document.getElementById('lista-personagens');
            if (user) {
                let userSnap = await getDoc(doc(db, "usuarios", user.uid));
                let papel = userSnap.exists() ? userSnap.data().papel : "jogador";

                const querySnapshot = await getDocs(collection(db, "fichas"));
                if (querySnapshot.empty) {
                    listaDiv.innerHTML = "<p>Ainda não existem heróis registados na nuvem.</p>";
                    return;
                }

                let html = "<div style='display:grid; gap:10px;'>";
                let encontrou = false;

                querySnapshot.forEach((d) => {
                    let ficha = d.data();
                    if (papel === "jogador" && ficha.uid !== user.uid) {
                        return;
                    }

                    encontrou = true;
                    html += `
                        <div style="background:#fdfbf7; border:1px solid #b59b6c; padding:12px; border-radius:3px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <strong style="font-family:'Cinzel',serif; color:#8b0000; font-size:1.1em;">${ficha.nomeHeroi || 'Herói sem nome'}</strong><br>
                                <span style="font-size:0.85em; color:#5c4033;">Criador: ${ficha.email || 'Desconhecido'} | Arquétipo: ${ficha.arquetipo || 'N/D'}</span>
                            </div>
                            <button type="button" class="btn-acao" onclick="abrirFicha('${d.id}')">📂 Abrir Ficha</button>
                        </div>
                    `;
                });

                html += "</div>";
                if (!encontrou) {
                    listaDiv.innerHTML = "<p>Ainda não tens nenhum herói guardado na nuvem.</p>";
                } else {
                    listaDiv.innerHTML = html;
                }
            } else {
                listaDiv.innerHTML = "<p>Tens de fazer login para aceder aos personagens.</p>";
            }
        });

        window.abrirFicha = function(fichaId) {
            window.location.href = `ficha.html?id=${fichaId}`;
        }
    </script>

    <style>
        body {
            font-family: 'Lora', serif;
            background-color: #1a1007;
            background-image: radial-gradient(#2b1b11, #0d0804);
            color: #2c1810;
            line-height: 1.5;
            padding: 15px;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: #f4ecd0;
            background-image: linear-gradient(to bottom, #f7f1df, #efe2c0);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 50px rgba(139,69,19,0.15);
            border: 6px solid #4a2e18;
            outline: 2px solid #8c6d46;
            outline-offset: -10px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-bottom: 3px double #7c5a3b;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #8b0000;
            font-size: 2em;
            margin: 0;
        }
        .panel {
            background: rgba(255, 253, 245, 0.6);
            border: 1px solid #b59b6c;
            padding: 15px 20px;
            border-radius: 3px;
            margin-bottom: 15px;
        }
        .btn-acao {
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.85em;
        }
        .btn-acao:hover { background: #a00; }
    </style>
</head>
<body>

<!-- Menu de Navegação Global -->
<div style="max-width: 900px; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; gap: 10px; font-family: 'Cinzel', serif; font-size: 0.85em; flex-wrap: wrap;">
    <a href="index.html" style="background: #4a2e18; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">🏠 Início</a>
    <a href="guia.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">📖 Guia</a>
    <a href="ficha.html" onclick="sessionStorage.setItem('veio_do_index', 'true')" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">🛡️ Ficha</a>
    <a href="grimorio.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">✨ Magias</a>
    <a href="historia.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">🗺️ História & Mapa</a>
    <a href="personagens.html" style="background: #7c5a3b; color: #f4ecd0; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">📜 Personagens</a>
    <a href="painel.html" id="link-painel-admin" style="display:none; background: #8b0000; color: #fff; padding: 6px 12px; border-radius: 2px; text-decoration: none; border: 1px solid #b59b6c;">⚙️ Painel Admin</a>
    <div id="user-menu-area" style="display:inline-block; margin-left: 10px;"></div>

<div class="container">
    <div class="header">
        <h1>Lista de Personagens</h1>
    </div>

    <div class="panel">
        <h2 style="font-family:'Cinzel',serif; color:#4a2e18; font-size:1.1em; margin-top:0;">Heróis da Aventura</h2>
